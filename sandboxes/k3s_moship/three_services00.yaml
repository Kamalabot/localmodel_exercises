---
apiVersion: v1
kind: Namespace
metadata:
  name: edge-stack
---
# 1. THE DATABASE (REDIS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-db
  namespace: edge-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: state-db-svc
  namespace: edge-stack
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
# 2. THE BACKEND (HTTPBIN API)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: edge-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-svc
  namespace: edge-stack
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 80
---
# 3. THE FRONTEND (NGINX)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: edge-stack
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-svc
  namespace: edge-stack
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080