---
apiVersion: v1
kind: Namespace
metadata:
  name: edge-stack
---
# ==========================================
# 1. THE DATABASE LAYER
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-db
  namespace: edge-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: state-db-svc
  namespace: edge-stack
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
# ==========================================
# 2. THE BACKEND LAYER (CUSTOM PYTHON)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-source-code
  namespace: edge-stack
data:
  main.py: |
    import http.server
    import socketserver
    import redis

    # Connect to the Redis Service via internal K8s DNS
    r = redis.Redis(host='state-db-svc', port=6379, db=0, decode_responses=True)

    class CustomHandler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            # Increment the hit counter in Redis
            try:
                count = r.incr('api_hits')
                response_text = f"Sovereign Python Backend Active!\nTotal Fleet Hits: {count}\n"
            except Exception as e:
                response_text = f"Backend active, but Redis connection failed: {e}\n"

            # Send HTTP Headers and Payload
            self.send_response(200)
            self.send_header('Content-type', 'text/plain')
            self.end_headers()
            self.wfile.write(response_text.encode('utf-8'))

    # Start the server on port 8000
    with socketserver.TCPServer(("", 8000), CustomHandler) as httpd:
        print("Custom Python Server listening on port 8000...")
        httpd.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-backend
  namespace: edge-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: python-runner
        image: python:3.11-alpine
        # Install the redis driver on boot, then execute our injected code
        command: ["/bin/sh", "-c", "pip install redis > /dev/null 2>&1 && python /app/main.py"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: code-volume
          mountPath: /app/main.py
          subPath: main.py
      volumes:
      - name: code-volume
        configMap:
          name: python-source-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-svc
  namespace: edge-stack
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
# ==========================================
# 3. THE FRONTEND LAYER (CUSTOM NGINX)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: edge-stack
data:
  default.conf: |
    server {
        listen 80;
        location / {
            # Route all incoming web traffic to the internal K8s Python Service
            proxy_pass http://backend-api-svc:8000;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-frontend
  namespace: edge-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: proxy-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: proxy-config-volume
        configMap:
          name: nginx-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-svc
  namespace: edge-stack
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080