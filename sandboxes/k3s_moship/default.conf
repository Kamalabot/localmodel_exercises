server {
    listen 80;

    location / {
        # Route directly to the backend service over the K3s internal network
        proxy_pass http://backend-api-svc.edge-stack.svc.cluster.local:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Prevent Nginx from drop-disconnecting slow socket responses
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}