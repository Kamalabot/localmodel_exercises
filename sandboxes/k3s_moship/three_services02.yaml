---
apiVersion: v1
kind: Namespace
metadata:
  name: edge-stack
---
# ==========================================
# RESOURCE 1: THE DATASTORE (REDIS)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-db
  namespace: edge-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: state-db-svc
  namespace: edge-stack
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
# ==========================================
# RESOURCE 2: THE BACKEND RUNNER (PYTHON)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-backend
  namespace: edge-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # THE DIRECT ROUTING FIX: Bypass CoreDNS completely for PyPI
      hostAliases:
      - ip: "151.101.0.223"
        hostnames:
        - "pypi.org"
      - ip: "151.101.64.223"
        hostnames:
        - "files.pythonhosted.org"
      containers:
      - name: python-runner
        image: python:3.11-alpine
        command:
        - /bin/sh
        - -c
        - |
          until pip install redis > /dev/null 2>&1; do 
            echo 'Waiting for PyPI uplink and DNS stabilization...'
            sleep 2
          done
          echo 'Dependencies secured. Booting Python interpreter.'
          python -u /app/main.py
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: code-volume
          mountPath: /app/main.py
          subPath: main.py
      volumes:
      - name: code-volume
        configMap:
          name: python-source-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-svc
  namespace: edge-stack
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
# ==========================================
# RESOURCE 3: THE FRONTEND RUNNER (NGINX)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-frontend
  namespace: edge-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: proxy-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: proxy-config-volume
        configMap:
          name: nginx-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-svc
  namespace: edge-stack
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080