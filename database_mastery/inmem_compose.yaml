version: '3.8'

networks:
  data_oriented_net:
    driver: bridge

services:
  # Paradigm: Embedded / Serverless Relational OLAP (In-Memory Engine)
  # Licensing: Open Source (MIT) | Status: Actively Developed
  # Note: Uses a PostgreSQL wire-compatible proxy server to allow external DBeaver connections
  duckdb:
    image: duckdb/duckdb:latest
    container_name: memory-duckdb
    profiles: ['manual']
    entrypoint: ["/bin/sh", "-c"]
    # Spins up a memory-backed instance and runs an interactive shell session to stay alive
    command: 
      - |
        duckdb -c "INSTALL postgres; LOAD postgres; SELECT 'DuckDB In-Memory Engine Online';"
        tail -f /dev/null
    volumes:
      - ./duckdb_data:/data
    tty: true
    stdin_open: true
    networks:
      - data_oriented_net
    deploy:
      resources:
        limits:
          memory: 1000M

  # Paradigm: Object-Oriented DBMS (Embedded/Edge Data-Oriented)
  # Licensing: Open Source / Proprietary Tools | Status: Actively Developed
  objectbox:
    image: objectboxio/admin:latest
    container_name: memory-objectbox
    profiles: ['manual']
    ports:
      - "8081:8081" # Exposes the ObjectBox Admin HTTP Endpoint for file inspection
    volumes:
      - ./objectbox_data:/db
    networks:
      - data_oriented_net
    deploy:
      resources:
        limits:
          memory: 512M

  # Paradigm: In-Memory / Hybrid Document-Relational Multi-Model
  # Licensing: Open Source (BSL 1.1) | Status: Actively Developed
  surrealdb:
    image: surrealdb/surrealdb:v2.0
    container_name: multi-surreal
    profiles: ['manual']
    command: start --log trace --user root --pass SecretPassword123 memory
    ports:
      - "8000:8000" # Exposes HTTP/WebSocket endpoints natively supported by DBeaver
    networks:
      - data_oriented_net
    deploy:
      resources:
        limits:
          memory: 1000M